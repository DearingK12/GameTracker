name: Package desktop downloads

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: Apple-Silicon
          - runner: macos-15-intel
            arch: Intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package macOS disk image
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="1.0.0"
          fi
          APP_VERSION="$APP_VERSION" bash ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GameTracker-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  package-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package Windows app
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq "tag") {
            $env:APP_VERSION = $env:REF_NAME -replace '^v', ''
          } else {
            $env:APP_VERSION = "1.0.0"
          }
          ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GameTracker-Windows-x64
          path: dist/*.zip
          if-no-files-found: error

  publish-release:
    name: Attach downloads to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-macos, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: GameTracker-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --title "$TAG" --generate-notes
          fi
